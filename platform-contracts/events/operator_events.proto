syntax = "proto3";

package mpp.events.v1;

import "google/protobuf/timestamp.proto";
import "common/enums.proto";

option go_package = "mpp/platformcontracts/events/v1;eventsv1";
option java_package = "uz.mpp.platformcontracts.events.v1";
option java_multiple_files = true;

// Принятый submit — публикуется в operator.submit.accepted как Operator SMPP
// Session Manager, так и Operator HTTP Gateway в один и тот же формат;
// downstream (DLR Correlation Writer, Delivery Reconciliation) не различает
// протокол (HLD §11.3, data_infrastructure_spec.md §3).
message OperatorSubmitAccepted {
  string message_id = 1;
  string stage_execution_id = 2;
  string operator_id = 3;
  mpp.common.v1.Protocol protocol = 4;
  // Идентификатор сообщения на стороне SMSC/оператора, если доступен
  // сразу (не все операторы возвращают его синхронно).
  string smsc_message_id = 5;
  int32 segment_id = 6;
  google.protobuf.Timestamp submitted_at = 7;
  // DLR SLA конкретного оператора — используется для расчёта
  // expires_at в dlr_correlation (data_infrastructure_spec.md §1.8, §1.9a).
  google.protobuf.Timestamp correlation_expires_at = 8;
}

// Сырой DLR — публикуется в operator.dlr. Operator SMPP Session Manager
// публикует его из deliver_sm; Operator HTTP Gateway — из нормализованного
// webhook-payload, в тот же формат (services_specifictaion.md §2.3a).
message OperatorDlr {
  string operator_id = 1;
  mpp.common.v1.Protocol protocol = 2;
  string smsc_message_id = 3;
  int32 segment_id = 4;
  // Код статуса в терминологии оператора, до нормализации DLR Manager'ом.
  string raw_status = 5;
  google.protobuf.Timestamp received_at = 6;
}

// Направление PDU относительно оператора — не бизнес-направление трафика
// (P2A сегодня не существует нигде в пайплайне, см. BACKOFFICE_ROADMAP.md
// "P2A" план), а то, какому бизнес-потоку принадлежит конкретный PDU:
// A2P — исходящий MT (submit_sm/submit_sm_resp), DLR — доставочная квитанция
// (deliver_sm/deliver_sm_resp).
enum PduDirection {
  PDU_DIRECTION_UNSPECIFIED = 0;
  PDU_DIRECTION_A2P = 1;
  PDU_DIRECTION_DLR = 2;
}

// Один реально пересечённый по проводу с оператором PDU — публикуется
// Operator SMPP Session Manager'ом в operator.pdu.log для per-PDU
// диагностики (BACKOFFICE_DESIGN_SPEC.md Экраны 38-40, "Raw" вкладка
// карточки сообщения). НЕ заменяет OperatorSubmitAccepted/OperatorDlr —
// это отдельный, чисто диагностический след (submit_sm, submit_sm_resp,
// deliver_sm, deliver_sm_resp), а не источник бизнес-корреляции DLR
// (та по-прежнему идёт через dlr.dlr_correlation/smsc_message_id, см.
// DeliveryReceiptParser javadoc).
message OperatorPduLog {
  string operator_id = 1;
  mpp.common.v1.Protocol protocol = 2;
  PduDirection direction = 3;
  // "SUBMIT_SM" | "SUBMIT_SM_RESP" | "DELIVER_SM" | "DELIVER_SM_RESP"
  // (см. codec.CommandId.name()).
  string pdu_type = 4;
  // SMPP header sequence_number — единственный ключ, который в рамках
  // ОДНОЙ живой SMPP-сессии связывает submit_sm с его submit_sm_resp
  // (тот же принцип, что уже использует OperatorSmppClientHandler.
  // pendingResponses); НЕ уникален глобально и переиспользуется по кругу.
  int32 sequence_number = 5;
  // message_id/stage_execution_id — известны сразу для A2P-направления
  // (submit_sm/submit_sm_resp: SubmitRequest уже несёт их), но НЕ известны
  // на уровне DLR-PDU (deliver_sm/_resp) — единственный ключ там
  // smsc_message_id, dlr-manager делает join позже через
  // dlr.dlr_correlation. Пустая строка для DLR-направления — не баг, тот
  // же архитектурный барьер, что уже задокументирован у OperatorDlr.
  string message_id = 6;
  string stage_execution_id = 7;
  string smsc_message_id = 8;
  // Односегментное упрощение, уже принятое в остальном сервисе (см.
  // OperatorSubmitServer.dispatchOne) — не вносится этой правкой заново.
  int32 segment_id = 9;
  // "OK" / "0x<hex command_status>" для submit_sm_resp; сырой SMPP DLR
  // stat (DELIVRD/EXPIRED/...) для deliver_sm; пусто для submit_sm
  // (запрос, статуса ещё нет) и deliver_sm_resp (всегда ESME_ROK ack).
  string status = 10;
  google.protobuf.Timestamp occurred_at = 11;
}
