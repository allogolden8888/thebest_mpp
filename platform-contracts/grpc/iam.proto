syntax = "proto3";

package mpp.grpc.v1;

import "google/protobuf/timestamp.proto";

option go_package = "mpp/platformcontracts/grpc/v1;grpcv1";
option java_package = "uz.mpp.platformcontracts.grpc.v1";
option java_multiple_files = true;

// Фаза 0 плана закрытия API-пробелов (IAM/RBAC/Audit, фундамент) —
// заменяет заглушку backoffice.users (V017__backoffice_stub.sql).
// Backoffice API (и позже Partner Self-Service API, Фаза 3) → IAM Service:
// синхронная проверка прав на каждый мутирующий запрос, ровно тот же
// паттерн синхронного gRPC-вызова, что уже есть у ExecutionControlService
// (internal_control.proto) — не пере-изобретаем стиль.
service IamService {
  // Вызывается middleware'ом вызывающего сервиса на КАЖДЫЙ мутирующий
  // запрос — простой request/response, без кеширования на этом шаге (тот
  // же принцип минимализма, что у ApplyOverride). Fail-closed: недоступность
  // IAM Service должна трактоваться вызывающим как запрет, не как молчаливое
  // разрешение — сервис, способный поставить на паузу весь трафик платформы,
  // не может по умолчанию проваливаться в "открыто" (см. history
  // services/backoffice-api/internal/auth/jwt.go RequireRole docstring —
  // тот же CRITICAL класс находки, который эта фаза закрывает целиком).
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);

  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc ListStaffAssignments(ListStaffAssignmentsRequest) returns (ListStaffAssignmentsResponse);
  rpc AssignStaffRole(AssignStaffRoleRequest) returns (AssignStaffRoleResponse);
  rpc RevokeStaffRole(RevokeStaffRoleRequest) returns (RevokeStaffRoleResponse);

  // BACKOFFICE_DESIGN_SPEC.md Экран 35 "Partner Users" — iam.
  // partner_portal_role_assignments (V025) уже реально используется
  // (partner-self-service-api читает роль партнёрского пользователя из
  // JWT-claim'а, не отсюда — эта таблица заведена заранее под будущее
  // использование, см. V025 комментарий), но ни одного RPC управлять ей
  // административно не было. Тот же shape, что Staff* выше, с двумя
  // структурными отличиями: role — не FK на iam.roles (открытый каталог),
  // а CHECK-ограниченный литерал ровно из двух значений
  // ('partner-admin'/'partner-viewer'); external_id — FK на
  // iam.partner_portal_users(external_id), не свободная строка.
  rpc ListPartnerPortalAssignments(ListPartnerPortalAssignmentsRequest) returns (ListPartnerPortalAssignmentsResponse);
  rpc AssignPartnerPortalRole(AssignPartnerPortalRoleRequest) returns (AssignPartnerPortalRoleResponse);
  rpc RevokePartnerPortalRole(RevokePartnerPortalRoleRequest) returns (RevokePartnerPortalRoleResponse);

  // luminous-hugging-charm.md, BACKOFFICE_DESIGN_SPEC.md Экран 33 "Admin
  // users" — реальный Keycloak не развёрнут нигде (backoffice-ui's
  // LoginView.vue сегодня буквально принимает вставленный JWT в textarea,
  // HTTP-раунд-трипа при логине нет), LDAP пользователем явно отклонён,
  // "сильно позже" будет настоящий Keycloak. До этого — полноценное
  // локальное управление аккаунтами (iam.staff_accounts): создать
  // сотрудника с логином/паролем прямо из бэкофиса. bcrypt-сравнение
  // целиком внутри IamService (VerifyStaffCredentials) — хеш пароля
  // никогда не пересекает границу процесса наружу, backoffice-api видит
  // только external_id/ok.
  rpc CreateStaffAccount(CreateStaffAccountRequest) returns (CreateStaffAccountResponse);
  rpc ListStaffAccounts(ListStaffAccountsRequest) returns (ListStaffAccountsResponse);
  rpc DeactivateStaffAccount(DeactivateStaffAccountRequest) returns (DeactivateStaffAccountResponse);
  rpc VerifyStaffCredentials(VerifyStaffCredentialsRequest) returns (VerifyStaffCredentialsResponse);

  // BACKOFFICE_ROADMAP.md Production Readiness Review P0#5 ("Identity-контур
  // не production-класса") — partner-portal side of the same gap already
  // closed for staff above. Two independent findings closed by these five
  // RPCs + ResolvePartnerPortalAccess below:
  //
  // 1. partner-portal-ui's LoginView.vue accepted a pasted JWT in a
  //    textarea — no real login form, no issuing backend, and (verified —
  //    grep for INSERT into iam.partner_portal_users found zero) no
  //    credentials ever existed for this table's rows in the first place.
  //    CreatePartnerPortalUser/ListPartnerPortalUsers/
  //    DeactivatePartnerPortalUser/VerifyPartnerPortalCredentials mirror the
  //    Staff* shape above exactly (bcrypt inside IamService, hash never
  //    crosses the gRPC boundary, migrations/V035__partner_portal_credentials.sql).
  // 2. partner-self-service-api trusted the role embedded in the JWT itself
  //    (realm_access.roles) instead of iam.partner_portal_role_assignments —
  //    a stale or revoked role kept working until the 8h token expired.
  rpc CreatePartnerPortalUser(CreatePartnerPortalUserRequest) returns (CreatePartnerPortalUserResponse);
  rpc ListPartnerPortalUsers(ListPartnerPortalUsersRequest) returns (ListPartnerPortalUsersResponse);
  rpc DeactivatePartnerPortalUser(DeactivatePartnerPortalUserRequest) returns (DeactivatePartnerPortalUserResponse);
  rpc VerifyPartnerPortalCredentials(VerifyPartnerPortalCredentialsRequest) returns (VerifyPartnerPortalCredentialsResponse);

  // ResolvePartnerPortalAccess — called by partner-self-service-api's
  // middleware on every request that needs to know the caller's role (the
  // same "no caching, synchronous gRPC call, fail-closed on transport
  // error" contract as CheckPermission above, not the JWT claim). active=
  // false covers BOTH an unknown external_id and a deactivated account
  // (iam.partner_portal_users.active), same reasoning as the
  // staff_accounts.active check baked into CheckPermission — a deactivated
  // partner user must lose access immediately, not when their token
  // happens to expire.
  rpc ResolvePartnerPortalAccess(ResolvePartnerPortalAccessRequest) returns (ResolvePartnerPortalAccessResponse);
}

message CheckPermissionRequest {
  string external_id = 1; // Keycloak `sub` из JWT вызывающего человека.
  string permission = 2;  // например "audit:read", "credentials:issue", "incident:manage".
}

message CheckPermissionResponse {
  bool allowed = 1;
  // Роли, через которые допуск был получен (пусто, если allowed=false) —
  // для аудита/отладки на стороне вызывающего, не для повторного
  // авторизационного решения там.
  repeated string roles = 2;
}

message Role {
  int64 id = 1;
  string name = 2;
  string description = 3;
  repeated string permissions = 4;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated Role roles = 1;
}

message StaffAssignment {
  int64 id = 1;
  string external_id = 2;
  string role = 3;
  string granted_by = 4;
  google.protobuf.Timestamp granted_at = 5;
}

message ListStaffAssignmentsRequest {
  // Пусто — все активные назначения; заполнено — фильтр по конкретному
  // пользователю (backoffice-ui "у кого какой доступ").
  string external_id = 1;
}

message ListStaffAssignmentsResponse {
  repeated StaffAssignment assignments = 1;
}

message AssignStaffRoleRequest {
  string external_id = 1;
  string role = 2;
  // sub вызывающего админа — уходит и в granted_by, и актёром в
  // iam.identity_audit.
  string granted_by = 3;
}

message AssignStaffRoleResponse {
  StaffAssignment assignment = 1;
}

message RevokeStaffRoleRequest {
  string external_id = 1;
  string role = 2;
  string revoked_by = 3;
}

message RevokeStaffRoleResponse {
  bool revoked = 1;
}

message PartnerPortalAssignment {
  int64 id = 1;
  string external_id = 2; // FK -> iam.partner_portal_users(external_id)
  string role = 3;        // 'partner-admin' | 'partner-viewer'
  string granted_by = 4;
  google.protobuf.Timestamp granted_at = 5;
}

message ListPartnerPortalAssignmentsRequest {
  // Пусто — все активные назначения; заполнено — фильтр по конкретному
  // партнёрскому пользователю.
  string external_id = 1;
}

message ListPartnerPortalAssignmentsResponse {
  repeated PartnerPortalAssignment assignments = 1;
}

message AssignPartnerPortalRoleRequest {
  string external_id = 1;
  string role = 2;
  string granted_by = 3;
}

message AssignPartnerPortalRoleResponse {
  PartnerPortalAssignment assignment = 1;
}

message RevokePartnerPortalRoleRequest {
  string external_id = 1;
  string role = 2;
  string revoked_by = 3;
}

message RevokePartnerPortalRoleResponse {
  bool revoked = 1;
}

message StaffAccount {
  string external_id = 1; // = username, см. package doc CreateStaffAccount выше.
  string username = 2;
  string display_name = 3;
  bool active = 4;
  google.protobuf.Timestamp created_at = 5;
  // Пароль/хеш никогда не покидают IamService — этого поля здесь
  // намеренно нет, не "забыто".
}

message CreateStaffAccountRequest {
  string username = 1;
  string password = 2; // plaintext на этом единственном hop'е (gRPC internal, mTLS-периметр), хешируется внутри IamService, никогда не логируется.
  string display_name = 3;
  string created_by = 4;
}

message CreateStaffAccountResponse {
  StaffAccount account = 1;
}

message ListStaffAccountsRequest {
  bool active_only = 1;
}

message ListStaffAccountsResponse {
  repeated StaffAccount accounts = 1;
}

message DeactivateStaffAccountRequest {
  string external_id = 1;
  string actor = 2;
}

message DeactivateStaffAccountResponse {
  bool deactivated = 1;
}

message VerifyStaffCredentialsRequest {
  string username = 1;
  string password = 2;
}

message VerifyStaffCredentialsResponse {
  bool ok = 1;
  string external_id = 2; // пусто, если ok=false
}

message PartnerPortalUser {
  string external_id = 1; // = username, см. package doc CreatePartnerPortalUser выше.
  string username = 2;
  string partner_id = 3;
  string display_name = 4;
  bool active = 5;
  google.protobuf.Timestamp created_at = 6;
  // Пароль/хеш никогда не покидают IamService — тот же принцип, что StaffAccount.
}

message CreatePartnerPortalUserRequest {
  string username = 1;
  string password = 2; // plaintext на этом единственном hop'е (gRPC internal, mTLS-периметр), хешируется внутри IamService, никогда не логируется.
  string partner_id = 3;
  string display_name = 4;
  string created_by = 5;
}

message CreatePartnerPortalUserResponse {
  PartnerPortalUser user = 1;
}

message ListPartnerPortalUsersRequest {
  // Пусто — все пользователи; заполнено — фильтр по конкретному партнёру
  // (backoffice-ui "Partner Users" создаёт пользователя ровно под одного
  // партнёра, но список показывает всех для видимости).
  string partner_id = 1;
}

message ListPartnerPortalUsersResponse {
  repeated PartnerPortalUser users = 1;
}

message DeactivatePartnerPortalUserRequest {
  string external_id = 1;
  string actor = 2;
}

message DeactivatePartnerPortalUserResponse {
  bool deactivated = 1;
}

message VerifyPartnerPortalCredentialsRequest {
  string username = 1;
  string password = 2;
}

message VerifyPartnerPortalCredentialsResponse {
  bool ok = 1;
  string external_id = 2; // пусто, если ok=false
  string partner_id = 3;  // пусто, если ok=false
}

message ResolvePartnerPortalAccessRequest {
  string external_id = 1;
}

message ResolvePartnerPortalAccessResponse {
  // false и если external_id неизвестен, и если iam.partner_portal_users.active=false
  // — вызывающий не должен различать эти два случая (не раскрываем
  // существование аккаунта), тот же принцип, что VerifyStaffCredentials.
  bool active = 1;
  string partner_id = 2; // пусто, если active=false
  // Активные (revoked_at IS NULL) роли из iam.partner_portal_role_assignments
  // — пусто, если active=false или ролей не назначено.
  repeated string roles = 3;
}
