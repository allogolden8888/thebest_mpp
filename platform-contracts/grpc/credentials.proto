syntax = "proto3";

package mpp.grpc.v1;

import "google/protobuf/timestamp.proto";

option go_package = "mpp/platformcontracts/grpc/v1;grpcv1";
option java_package = "uz.mpp.platformcontracts.grpc.v1";
option java_multiple_files = true;

// Фаза 1 плана закрытия API-пробелов — живой выпуск/ротация partner
// credentials (заменяет статическую deploy-time связку credential_ref ->
// env var, k8s/generate_manifests.py + partner-rest-receiver/src/auth.rs).
// Единственный писатель в Vault по путям credential_ref
// (vault://partners/<partner_id>/<application_id>/<field>) — Terraform
// (infra/terraform/vault-secrets.tf) НЕ сеет эти пути, только пять
// платформенных секретов; до этого сервиса они были пустыми в реальном
// Vault.
service CredentialIssuerService {
  // RotateCredential НЕ создаёт новый application/credential_ref — тот уже
  // должен существовать в PARTNER config (configuration-service,
  // entity_type=PARTNER), заведён через существующий config API при
  // онбординге партнёра/приложения. Генерирует новое случайное значение
  // секрета и пишет его В ТОТ ЖЕ Vault-путь, что уже указан в
  // credential_ref этого application_id — первый вызов для только что
  // заведённого application'а фактически "issue" (Vault-путь до этого не
  // содержал значения), последующие вызовы — "rotate" (перезаписывают).
  // Один RPC на оба случая — эффект идентичен, backoffice-ui одна кнопка
  // "Rotate credential" вне зависимости от того, был ли секрет уже выпущен.
  rpc RotateCredential(RotateCredentialRequest) returns (RotateCredentialResponse);

  rpc ListIssuedSecrets(ListIssuedSecretsRequest) returns (ListIssuedSecretsResponse);
}

message RotateCredentialRequest {
  string partner_id = 1;
  string application_id = 2;
  string issued_by = 3; // Keycloak `sub` вызывающего — аудит (credentials.rotation_audit).
}

message RotateCredentialResponse {
  string credential_ref = 1;
  int32 secret_version = 2;
  // Plaintext присутствует ТОЛЬКО в этом ответе (show-once,
  // backoffice-ui "Rotate credential" модалка) — credentials.issued_secrets
  // хранит metadata (version/status/issued_by), не сам секрет; секрет живёт
  // только в Vault.
  string plaintext_secret = 3;
  google.protobuf.Timestamp issued_at = 4;
}

message IssuedSecretSummary {
  int64 id = 1;
  string partner_id = 2;
  string application_id = 3;
  string credential_ref = 4;
  int32 secret_version = 5;
  string status = 6; // "active" | "revoked"
  google.protobuf.Timestamp issued_at = 7;
  string issued_by = 8;
}

message ListIssuedSecretsRequest {
  // Обязателен — намеренно нет "все секреты всех партнёров сразу" в этом
  // RPC (нет обоснованного use case для листинга кросс-партнёрски, в
  // отличие от Ф9 "кросс-партнёрский поиск сообщений", который про другое).
  string partner_id = 1;
}

message ListIssuedSecretsResponse {
  repeated IssuedSecretSummary secrets = 1;
}
