  billing-service:
    name: Billing Service (mvn test, порт billing_account_state.py на Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: "mvn test (21 тестов: BillingAccountState/TariffResolver/BillingService/HealthServer)"
        run: |
          cd services/billing-service
          mvn -B "-Dprotobuf.protocExecutable=$(which protoc)" test

  routing-service:
    name: Routing Service (cargo build + test, real platform-contracts + routing_table.schema.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc + librdkafka
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler librdkafka-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo build (compiles platform-contracts/common/*.proto via build.rs)
        run: |
          cd services/routing-service
          cargo build
      - name: "cargo test (10 тестов: routing/kafka_io/health)"
        run: |
          cd services/routing-service
          cargo test

  pipeline-engine:
    name: Pipeline Engine (cargo build + test, real platform-contracts common+events)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc + librdkafka
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler librdkafka-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo build (compiles platform-contracts common+events protos via build.rs)
        run: |
          cd services/pipeline-engine
          cargo build
      - name: "cargo test (12 тестов: execution_state/build_stage_execute/kafka_io/health)"
        run: |
          cd services/pipeline-engine
          cargo test

  terraform:
    name: Terraform (fmt + validate против реальной схемы yandex-cloud провайдера)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: terraform fmt -check
        run: terraform -chdir=infra/terraform fmt -check -diff
      - name: terraform init (без backend, без реальных cloud-креденшлов)
        run: terraform -chdir=infra/terraform init -backend=false
      - name: terraform validate
        run: terraform -chdir=infra/terraform validate

  # --- Расширение CI-покрытия (BACKOFFICE_ROADMAP.md, P0 #7): ниже добавлены
  # go build+test / cargo build+test / mvn test для всех сервисов services/*,
  # у которых есть реальный код (go.mod / Cargo.toml / pom.xml) и которые ещё
  # не были покрыты выше (protobuf/migrations/python-artifacts/k8s-manifests/
  # kafka-topics/destination-resolution-service/policy-service/billing-service/
  # routing-service/pipeline-engine/terraform). Каждый job — build+test ровно
  # так же, как это делалось вручную в этой сессии; паттерн (checkout →
  # setup языка → cd в директорию сервиса → build → test) идентичен уже
  # существующим job'ам выше, без caching (существующие job'ы его тоже не
  # используют). backoffice-ui и partner-portal-ui (Vue/vitest, только
  # package.json) сюда сознательно не включены: в файле нет ни одного job'а
  # для Node/npm, который можно было бы повторить один-в-один, а изобретать
  # новый паттерн вместо копирования существующего — вне рамок этой правки;
  # это отдельный, реальный пробел в CI-покрытии (см. BACKOFFICE_ROADMAP.md).

