# Локальная инфраструктура для ручной проверки платформы вне k8s —
# PostgreSQL/Redis/Kafka с именами переменных окружения ровно как в
# infra/secrets/generate_external_secrets.py (SECRET_KEYS), чтобы сервисы
# подключались без дополнительной переменной-склейки. Порты на хосте
# сдвинуты (5433/6380-6382/9094), т.к. на этой машине уже запущены
# локальные (не-Docker) postgres/redis на дефолтных портах.
#
# Пока только инфраструктура — сами 32 сервиса добавляются следующим шагом,
# после того как эта база поднимется и пройдут миграции.
#
# Запуск:
#   cd infra/docker && docker compose up -d
#   docker compose ps
#   docker compose logs -f kafka   # если что-то не поднимается

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mpp
      POSTGRES_PASSWORD: mpp_local_dev
      POSTGRES_DB: mpp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpp -d mpp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-runtime:
    image: redis:7-alpine
    # --save "" отключает RDB point-in-time snapshotting (дефолт "3600 1 300
    # 100 60 10000") — реальная находка нагрузочного теста: под 300 TPS
    # (~19 Redis-round-trip'ов на сообщение с pipeline-engine/policy/billing/
    # delivery суммарно) порог "60 10000" стабильно триггерился, каждый
    # BGSAVE занимал ~7с (INFO persistence: rdb_last_bgsave_time_sec) и forkал
    # процесс под конкурентной записью — реальный, измеримый вклад в то, что
    # redis-runtime стабильно показывал 90-165% CPU в docker stats во время
    # прогона. Runtime Redis здесь — чисто эфемерное состояние (TTL'd
    # ключи/CAS-состояние, которое пайплайн переживает без диска — ничего
    # здесь не должно требовать durability между рестартами локального
    # docker-compose), так что персистентность не нужна вообще.
    command: ["redis-server", "--requirepass", "mpp_local_dev", "--save", ""]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "mpp_local_dev", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-configuration:
    image: redis:7-alpine
    # --save "" отключает RDB snapshotting — тот же паттерн, что и у
    # redis-runtime выше (см. комментарий там для деталей про BGSAVE-стойки
    # под нагрузкой). Это перезаписываемый кеш (rebuildable cache, см.
    # hld.md:1356) — не нужна durability между рестартами локального
    # docker-compose, дефолтная snapshot-политика только рискует теми же
    # многосекундными BGSAVE-стойками под нагрузкой без какой-либо пользы.
    command: ["redis-server", "--requirepass", "mpp_local_dev", "--save", ""]
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "mpp_local_dev", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-billing:
    image: redis:7-alpine
    # --appendonly yes — в отличие от redis-configuration/redis-runtime
    # выше, здесь хранится живой account balance/CAS epoch state (см.
    # hld.md:342), а не перезаписываемый кеш — infra/terraform/redis.tf
    # требует AOF для этого инстанса в production. Локальный compose до
    # этого не имел ни --save "", ни --appendonly — на дефолтной RDB-only
    # персистентности потеря данных между снапшотами возможна при падении
    # контейнера. Здесь НЕ добавляем --save "" — этому инстансу нужна
    # durability, не только скорость, в отличие от redis-configuration.
    command: ["redis-server", "--requirepass", "mpp_local_dev", "--appendonly", "yes"]
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "mpp_local_dev", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # KRaft-режим (без ZooKeeper) — один брокер, действует и как контроллер.
  # Официальный образ Apache Kafka, не Bitnami/Confluent — минимум лишней
  # конфигурации.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # auto-create — упрощение только для локальной проверки; в k8s топики
      # создаются явно из infra/kafka/rendered/kafka-topics.yaml
      # (infra/kafka/generate_kafka_topics.py), с реальными partition-counts,
      # не дефолтом.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Дефолт образа (num.network.threads=3) — под 6 сервисами, у каждого
      # несколько consumer/producer-подключений на 30 топиков — реальная
      # находка: kafka стабильно показывал 100-200% CPU в docker stats под
      # нагрузкой даже после того, как producer-side backpressure (QueueFull)
      # и redis-runtime CPU были устранены. Подняли явно, не гадая на дефолте.
      # 2026-08-13 1500 TPS push (12-core/15GB host): при 300 TPS Kafka
      # держалась на ~5 ядрах из 12 доступных Docker'у — не cgroup-лимит
      # (контейнер ничем не ограничен), а внутренние thread pool'ы брокера.
      # 12/16/16 (44 потока суммарно) было откалибровано на AMD-сессии (12
      # CPU) — на этой машине (8 CPU) это, судя по всему, не разгружает
      # брокер, а создаёт ЛИШНИЙ scheduling-контеншен: живое измерение
      # (docker stats во время 300 TPS прогона) показало Kafka на 150-260%
      # CPU устойчиво, что напрямую коррелировало с ростом produce_ms в
      # pipeline-engine (p50=171/p95=641/p99=1095/max=1457мс — при том, что
      # Redis load/cas у того же сервиса оставались <60мс даже на p99).
      # Вернули к значениям, уже провалидированным на ЭТОЙ машине
      # (num.network.threads=6 из первой сессии) плюс дефолт образа для
      # num.io.threads/background.threads (не задаём явно).
      KAFKA_NUM_NETWORK_THREADS: "6"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "mpp-local-dev-cluster-1"
      # Дефолт образа -Xmx1G/-Xms1G — при 33 топиках/365 партициях (число
      # партиций считается из PRODUCTION replica-counts в
      # generate_kafka_topics.py, не подогнано под один локальный брокер)
      # это было диагностировано как реальная причина многосекундной
      # задержки НА КАЖДОМ хопе пайплайна равномерно (не конкретно
      # ROUTING->DELIVERY) — см. dynamic-seeking-russell.md investigation.
      # 4G было откалибровано на AMD-сессии (12 CPU/15GB Docker VM) для 1500
      # TPS push — на исходной машине (8 CPU/7.75GB, общий с двумя другими
      # проектами) это привело к реальному OOMKilled=true у самой Kafka
      # (docker inspect подтвердил) после нескольких дней непрерывной работы.
      # 2G — значение, уже провалидированное на ЭТОЙ машине в исходном
      # LATENCY_INVESTIGATION.md. Если снова тестируете на большой машине —
      # поднимайте обратно осознанно, не бездумно объединяя оба среза.
      KAFKA_HEAP_OPTS: "-Xmx2G -Xms2G"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # Публикует config.changes из config.config_outbox (PostgreSQL) — реальный
  # источник для проверки config-hot-reload в destination-resolution-service
  # (config_reload.rs), не синтетическая заглушка. Мигрирует не сам —
  # V001..V023 применяются вручную (см. migrations/README.md) до старта.
  config-event-publisher:
    image: mpp/config-event-publisher:test
    ports:
      - "9102:9090"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mpp
      POSTGRES_USER: mpp
      POSTGRES_PASSWORD: mpp_local_dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POLL_INTERVAL_MS: "500"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Первый сервис "ходового скелета" — входная точка REST-ingest. credential_ref
  # "vault://partners/click_uz/main/api_key" (config_schemas/examples/partner.valid.json,
  # уже запечён в образ) резолвится в PARTNER_CRED_VAULT___PARTNERS_CLICK_UZ_MAIN_API_KEY
  # (auth.rs::credential_ref_to_env_var) — значение ниже это и есть тестовый API-ключ,
  # которым нужно бить в /v1/messages как X-Api-Key.
  partner-rest-receiver:
    image: mpp/partner-rest-receiver:test
    ports:
      - "8080:8080"
      - "9091:9090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_RUNTIME_HOST: redis-runtime
      REDIS_RUNTIME_PORT: "6379"
      REDIS_RUNTIME_PASSWORD: mpp_local_dev
      PARTNER_CRED_VAULT___PARTNERS_CLICK_UZ_MAIN_API_KEY: local-dev-test-key
      # combined-api-gaps добавил VaultAuthVerifier как дефолт
      # (AUTH_VERIFIER_MODE unset -> "vault") — до сегодняшнего ребилда
      # этот сервис тихо работал на старом pre-merge образе (EnvAuthVerifier
      # всегда), поэтому разрыв не был виден раньше. Явный "env" — тот
      # самый bootstrap/break-glass режим, что описан в самом
      # build_auth_verifier() в main.rs, а не обход валидации: реального
      # Vault-провиженинга credential'ов под тестового партнёра здесь нет.
      AUTH_VERIFIER_MODE: env
      RUST_LOG: info
    # 2026-08-13 1500 TPS push — partner.valid.json запечён в образ на
    # build-time (COPY, PARTNER_CONFIG_PATH), rate_limit_tps=300 там
    # блокировал бы всё сверх этого на уровне самого партнёра ещё до
    # пайплайна. Volume mount поверх запечённого пути — тот же паттерн,
    # что уже использует partner-notification-service ниже — подхватывает
    # правку rate_limit_tps в config_schemas/examples/partner.valid.json
    # без пересборки образа.
    volumes:
      - ../../config_schemas/examples/partner.valid.json:/config_schemas/examples/partner.valid.json:ro
    depends_on:
      kafka:
        condition: service_healthy
      redis-runtime:
        condition: service_healthy

  # Второй хоп ходового скелета — консьюмер incoming.messages, оркестрирует
  # весь stage.* pipeline через ExecutionState в Redis (CAS).
  pipeline-engine:
    image: mpp/pipeline-engine:test
    ports:
      - "9092:9090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_RUNTIME_HOST: redis-runtime
      REDIS_RUNTIME_PORT: "6379"
      REDIS_RUNTIME_PASSWORD: mpp_local_dev
      RUST_LOG: info
      # 2026-08-13 1500 TPS push, второй раунд — strace под нагрузкой (см.
      # msgctx.rs fix) показал pipeline-engine в основном в futex/poll (в
      # ожидании), не в вычислениях; redis-runtime отдельно измерен на ~5%
      # CPU при ~6000 ops/s (не бутылочное горлышко). Совокупный CPU по всем
      # контейнерам не превышал ~560% из 1200% доступных — узкое место не
      # железо, а искусственный потолок конкурентности задачного пула (было
      # 256 по умолчанию для run_incoming_loop/run_completed_loop, второй
      # видит в 5 раз больше трафика, см. kafka_io.rs). Подняли 4x.
      # 2026-08-13 1500 TPS push, четвёртый раунд — калибровка вниз после
      # находок про lock-контеншен/thread-per-request: 1024 давало отличный
      # throughput, но часть этого CPU уходила в scheduling/semaphore-overhead
      # токио, а не в полезную работу (Little's Law на p50~135ms/1500 TPS
      # требует ~300 в потолке con concurrency, не 1024). Проверяем, держит
      # ли меньшее число ту же пропускную способность дешевле.
      PIPELINE_INCOMING_CONCURRENCY: "384"
      PIPELINE_COMPLETED_CONCURRENCY: "384"
      PIPELINE_RETRY_TRIGGER_CONCURRENCY: "128"
    depends_on:
      kafka:
        condition: service_healthy
      redis-runtime:
        condition: service_healthy

  # Третий хоп — резолвит msisdn в operator_id через запечённый в образ
  # number_range_snapshot.json (13 префиксов, включая development_plan.md 5.1).
  destination-resolution-service:
    image: mpp/destination-resolution-service:test
    ports:
      - "9093:9090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RUST_LOG: info
      # 2026-08-13 1500 TPS push, второй раунд — см. pipeline-engine выше.
      DESTINATION_RESOLUTION_CONCURRENCY: "1024"
    depends_on:
      kafka:
        condition: service_healthy

  # Четвёртый хоп — банворды/шаблоны/consent/time-of-day/spam-throttle
  # (POLICY_RULESET_PATH/POLICY_TEMPLATE_PATH уже запечены в образ).
  policy-service:
    image: mpp/policy-service:test
    ports:
      - "9095:9090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_RUNTIME_HOST: redis-runtime
      REDIS_RUNTIME_PORT: "6379"
      REDIS_RUNTIME_PASSWORD: mpp_local_dev
      RUST_LOG: info
      # 2026-08-13 1500 TPS push, второй раунд — см. pipeline-engine выше.
      POLICY_CONCURRENCY: "1024"
    depends_on:
      kafka:
        condition: service_healthy
      redis-runtime:
        condition: service_healthy

  # Пятый хоп — тарификация (BILLING_TARIFF_PATH — дефолтный fallback-тариф,
  # запечён в образ), атомарный charge через apply_atomic_charge.lua на
  # redis-billing. account_id = partner_id, per-partner тариф — TariffCache
  # читает redis-configuration (Фаза 5a плана закрытия API-пробелов:
  # multi-tenancy в Billing Service), с graceful fallback на
  # BILLING_TARIFF_PATH, если для партнёра ничего не опубликовано.
  billing-service:
    image: mpp/billing-service:test
    ports:
      - "9096:9090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_BILLING_HOST: redis-billing
      REDIS_BILLING_PORT: "6379"
      REDIS_BILLING_PASSWORD: mpp_local_dev
      REDIS_CONFIGURATION_HOST: redis-configuration
      REDIS_CONFIGURATION_PORT: "6379"
      REDIS_CONFIGURATION_PASSWORD: mpp_local_dev
      # 2026-08-13 1500 TPS push — калибровка вниз с 512 (исходный, p95=336ms,
      # ~552 потока). 200 и 350 оба дали p95~1800-1900ms — резкий порог, не
      # плавная деградация (Little's Law: запас на всплески трафика, не сама
      # по себе величина concurrency). 450 — по другую сторону порога:
      # p50=112ms/p95=254ms (не хуже 512), ~490 потоков вместо 552.
      # 450 — калиброванный JFR+binary-search оптимум AMD-сессии (12 CPU/15GB,
      # см. LATENCY_INVESTIGATION_1500TPS.md Часть 3): их же данные показали
      # РЕЗКИЙ порог, не плавную деградацию (200 потоков -> p95=1811мс vs
      # 450 -> p95=254мс) — то есть оптимум специфичен для числа ядер, его
      # нельзя пропорционально пересчитать без повторной калибровки.
      #
      # 2026-08-18, эта машина (8 CPU/7.75GB): и billing, и delivery стояли
      # на 450 одновременно -> p50=5758мс/p95=9690мс. A/B с изоляцией
      # переменной (по одному сервису за раз, оба свежепересозданы —
      # holdout мешает сравнению, если не рестартовать оба):
      #   billing=128, delivery=128 (контроль)  -> p50=869мс  p95=2621мс
      #   billing=128, delivery=450 (один)      -> p50=567мс  p95=1157мс (!)
      #   billing=450, delivery=128 (один)      -> p50=778мс  p95=3778мс,
      #     ПРИЧЁМ провал ушёл не в billing's own стадию (policy->billing
      #     p95=734мс, нормально), а в НЕСВЯЗАННЫЙ routing->delivery хоп
      #     (p95=2248мс) — т.е. один сервис с раздутым пулом потоков душит
      #     ЧУЖОЙ, корректно настроенный сервис через общий CPU хоста
      #     (Docker не изолирует CPU между контейнерами без cpus-лимитов).
      # Вывод: порог — это не "concurrency каждого сервиса по отдельности
      # <= X", а суммарный бюджет ОС-тредов ВСЕХ совместно размещённых
      # сервисов относительно физических ядер хоста. 128/128 — safe default,
      # уже проверенный на этой машине раньше в этой же сессии.
      BILLING_CONCURRENCY: "128"
    # 2026-08-13 1500 TPS push (AMD, 12 CPU/15GB) — Dockerfile's ENTRYPOINT
    # hardcodes -Xms512m -Xmx1g; bumped to 3g there for 450-thread headroom.
    # 2026-08-17: 3g contributed to Kafka's OOMKilled=true on THIS machine
    # (8 CPU/7.75GB, shared with two other running projects) — right-sized
    # to 1.5g, still above the image default for the 450-thread stack
    # overhead, well short of starving the rest of the stack.
    # 2026-08-19: fixed -Xms/-Xmx replaced with container-aware percentage
    # sizing (-XX:MaxRAMPercentage/-XX:InitialRAMPercentage), same change
    # as the Dockerfile's own ENTRYPOINT — this override still takes
    # precedence for local docker-compose runs, so it has to carry the same
    # flags or the Dockerfile fix is silently shadowed here. 75% ceiling
    # against the mem_limit below (2g) lands at ~1.5g heap, matching the
    # 1.5g figure calibrated above; actual value now scales automatically
    # if mem_limit changes instead of needing a second hand-edit.
    entrypoint: ["java", "-XX:MaxRAMPercentage=75", "-XX:InitialRAMPercentage=50", "-XX:StartFlightRecording=filename=/tmp/billing.jfr,duration=150s,dumponexit=true,settings=profile", "-jar", "/app/billing-service.jar"]
    # Оценка (estimate), близко к текущему эффективному heap-потолку выше
    # (~1.5g при 75% от mem_limit) — НЕ откалибровано отдельным нагрузочным
    # прогоном под cgroup-лимитом, только выведено из уже откалиброванного
    # -Xmx1500m. Нужна повторная 1500 TPS проверка (см.
    # LATENCY_INVESTIGATION_1500TPS.md) с реальным mem_limit, а не
    # безлимитным контейнером, прежде чем считать это финальным числом.
    mem_limit: 2g
    # Реальная находка (нагрузочный прогон): Main.java теперь принудительно
    # System.exit(1) на фатальной ошибке consumer-цикла (иначе HealthServer
    # держит процесс "живым" не-daemon потоком с /healthz=200 у мёртвого
    # consumer'а) — без restart здесь этот честный exit просто останавливал
    # бы контейнер навсегда вместо самовосстановления.
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis-billing:
        condition: service_healthy
      redis-configuration:
        condition: service_healthy

  # Шестой хоп — резолвит финальный route (protocol/route_epoch/failover)
  # через запечённый ROUTE_TABLE_PATH.
  routing-service:
    image: mpp/routing-service:test
    ports:
      - "9097:9090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 2026-08-13 1500 TPS push, второй раунд — см. pipeline-engine выше.
      ROUTING_CONCURRENCY: "1024"
    depends_on:
      kafka:
        condition: service_healthy

  # Седьмой хоп — реальный операторский submit через OperatorSubmitClient
  # (gRPC), маршрут резолвится из GatewayRegistry (Runtime Redis). Пока в
  # registry нет ни одной записи (operator-smpp-session-manager ещё не
  # поднят) — fail-safe путь, публикует SUBMISSION_OUTCOME_UNKNOWN, не падает.
  delivery-service:
    image: mpp/delivery-service:test
    ports:
      - "9098:9090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_RUNTIME_HOST: redis-runtime
      REDIS_RUNTIME_PORT: "6379"
      REDIS_RUNTIME_PASSWORD: mpp_local_dev
      # 2026-08-18 A/B-протестировано на этой машине (8 CPU/7.75GB) —
      # см. подробный комментарий у BILLING_CONCURRENCY выше. Изолированный
      # тест (DELIVERY_CONCURRENCY=450 один, BILLING_CONCURRENCY=128) НЕ
      # воспроизвёл провал сам по себе (p50=567мс) — вывод: проблема не
      # "эта служба сама себя душит своим пулом", а совокупный бюджет ОС-
      # тредов ВСЕХ совместно размещённых сервисов на общем пуле ядер хоста
      # (Docker не изолирует CPU между контейнерами без явных cpus-лимитов).
      # 128 — безопасное значение до AMD-тюнинга (12 CPU/15GB), под которое
      # калибровка 450 не переносится 1:1.
      DELIVERY_CONCURRENCY: "128"
    # Оценка (estimate) — Dockerfile ENTRYPOINT теперь -XX:MaxRAMPercentage=75,
    # структурно тот же профиль, что и billing-service (тот же 128-поточный
    # пул, тот же Redis-клиент), так что взят тот же mem_limit по аналогии, а
    # не из отдельной калибровки этого сервиса. Нужна отдельная 1500 TPS
    # проверка (см. LATENCY_INVESTIGATION_1500TPS.md) под этим лимитом, а не
    # безлимитным контейнером, прежде чем считать финальным.
    mem_limit: 2g
    depends_on:
      kafka:
        condition: service_healthy
      redis-runtime:
        condition: service_healthy

  # Восьмой хоп — реальный SMPP bind к тестовому SMSC (host/port/креды из
  # infra/docker/.env, gitignored — см. .env.example). OPERATOR_ID/ROUTE_ID
  # должны совпадать с тем, что routing-service резолвит из
  # routing_table.valid.json (operator_id=beeline_uz, active route_id=
  # beeline_smpp_primary) — иначе delivery-service не найдёт эту запись в
  # GatewayRegistry (Runtime Redis) при поиске по (operator_id, route_id).
  operator-smpp-session-manager:
    image: mpp/operator-smpp-session-manager:test
    # hostname явно задан — Main.java пишет в OperatorRouteRegistry свой
    # HOSTNAME как gRPC-адрес для delivery-service (тот же паттерн, что
    # partner-smpp-gateway; в k8s это резолвится через headless Service DNS
    # StatefulSet-пода). Без явного hostname тут Docker подставляет случайный
    # container ID, который delivery-service не сможет резолвить.
    hostname: operator-smpp-session-manager
    ports:
      - "9099:9090"
      - "9000:9000"
    environment:
      OPERATOR_ID: beeline_uz
      ROUTE_ID: beeline_smpp_primary
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_RUNTIME_HOST: redis-runtime
      REDIS_RUNTIME_PORT: "6379"
      REDIS_RUNTIME_PASSWORD: mpp_local_dev
      OPERATOR_SMSC_HOST: ${OPERATOR_SMSC_HOST:-localhost}
      OPERATOR_SMSC_PORT: ${OPERATOR_SMSC_PORT:-2775}
      # 2026-08-13 1500 TPS push, третий раунд — TPS_LIMIT=500 (дефолт) смоделирован
      # как реалистичный потолок КОНТРАКТА с реальным оператором (намеренное
      # бизнес-ограничение, не узкое место инфраструктуры) — под нашей нагрузкой
      # 26.7% DELIVERY-стадии стабильно получали TPS_THROTTLED. Здесь на другом
      # конце — свой же одноразовый smsc-simulator, не настоящий оператор с
      # контрактным TPS, так что для этого конкретного стресс-теста поднимаем
      # оба лимита; в реальном деплое TPS_LIMIT должен отражать реальный
      # контракт оператора, не сниматься бездумно.
      TPS_LIMIT: "3000"
      # 2026-08-18, эта машина (8 CPU/7.75GB): тот же паттерн ещё раз, но
      # хуже — Executors.newFixedThreadPool(maxConcurrentSubmits) в Main.java
      # создаёт 300 реальных ОС-потоков ("operator-smpp-pacer-worker",
      # видно в /proc/1/task). Обнаружено при 100% SUBMIT_TIMEOUT на реальном
      # SMPP submit (OperatorSubmitServer.dispatchOne) даже на тривиальной
      # нагрузке (10 TPS) — /proc/net/tcp внутри контейнера показал ноль
      # активных соединений к 172.30.19.206:8275, т.е. SMPP-сессия мертва, а
      # SmppConnectionSupervisor её не поднимает. Правдоподобный механизм:
      # 300 воркер-потоков вытесняют CPU у Netty I/O event loop, который
      # держит соединение и обрабатывает reconnect — тот же класс проблемы,
      # что и у BILLING_CONCURRENCY/DELIVERY_CONCURRENCY выше, только тут
      # цена не "просто медленно", а полная потеря сессии. Возвращаем к 100
      # (дефолт до AMD-тюнинга) для проверки.
      MAX_CONCURRENT_SUBMITS: "100"
      SMPP_SYSTEM_ID: ${SMPP_SYSTEM_ID:-mpp_esme}
      SMPP_PASSWORD: ${SMPP_PASSWORD:-demo_password}
    # Оценка (estimate) — 100-поточный пул (MAX_CONCURRENT_SUBMITS) +
    # Netty I/O event loop поменьше, чем у billing/delivery; 1.5g даёт
    # ~1.1g heap на 75%, с запасом под сам Netty off-heap буферы (SMPP-сессия
    # чувствительна к CPU/memory starvation — см. комментарий про 300 воркер-
    # потоков выше). Не откалибровано отдельным нагрузочным прогоном под
    # этим лимитом — см. LATENCY_INVESTIGATION_1500TPS.md, нужна проверка.
    mem_limit: 1.5g
    depends_on:
      kafka:
        condition: service_healthy
      redis-runtime:
        condition: service_healthy

  # Девятый хоп — не участник stage.* пайплайна, а параллельный агрегатор:
  # слушает stage.completed (все стадии) + delivery.status, строит единый
  # message.lifecycle и его же changelog (transactional producer). На старте
  # полностью вычитывает message-state.changelog (restore), только потом
  # readyz=true — первый реальный прогон этого transactional-пути против
  # настоящего Kafka (раньше не проверялся живьём, см. README).
  message-state-resolver:
    image: mpp/message-state-resolver:test
    ports:
      - "9100:9090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # Оценка (estimate) — единственный "тяжёлый" момент старта: полный
    # restore message-state.changelog из Kafka в память до readyz=true;
    # устоявшийся steady-state расход ниже billing/delivery (нет
    # REDIS_*_CONCURRENCY-пула потоков). 1g даёт ~750m heap на 75%. Не
    # откалибровано отдельным нагрузочным прогоном под этим лимитом — см.
    # LATENCY_INVESTIGATION_1500TPS.md, нужна проверка, особенно на объём
    # changelog при более длительных прогонах.
    mem_limit: 1g
    depends_on:
      kafka:
        condition: service_healthy

  # Десятый хоп — слушает message.lifecycle (девятый хоп) + notification.retry,
  # резолвит канал уведомления партнёра (SMPP/REST) через msgctx.partner_id.
  # PARTNER_CONFIG_PATH указывает на тот же partner.valid.json, что уже
  # запечён в partner-rest-receiver (единственный тестовый партнёр click_uz,
  # notification_callback_url — настоящий внешний домен, не слушающий в этой
  # песочнице) — доставка ожидаемо уходит в retry-петлю (schedule.go, 30с база
  # / 5мин потолок) до NotificationTTL (24ч), это штатное поведение локального
  # прогона, не баг. SMPP-канал тоже недостижим: Partner SMPP Gateway не
  # реализован ни в одном репозитории, smpp:partner_session:* в Redis пуст.
  partner-notification-service:
    image: mpp/partner-notification-service:test
    ports:
      - "9101:9090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_RUNTIME_HOST: redis-runtime
      REDIS_RUNTIME_PORT: "6379"
      REDIS_RUNTIME_PASSWORD: mpp_local_dev
    volumes:
      - ../../config_schemas/examples/partner.valid.json:/config/partner.valid.json:ro
    depends_on:
      kafka:
        condition: service_healthy
      redis-runtime:
        condition: service_healthy

  # dynamic-seeking-russell.md "Retry-until-expiry для DELIVERY" — держит
  # STAGE_RETRY (наравне с уже существующими DLR_CORRELATION_RETRY/
  # NOTIFICATION_RETRY) до due_at, затем перепубликует в
  # pipeline.retry.triggers, который потребляет сам Pipeline Engine.
  # Kafka Streams (exactly_once_v2, RocksDB state store) — не собирается из
  # корня репозитория как остальные Java-сервисы: protobuf-код закоммичен
  # (см. services/scheduler-background-lane/README.md "Регенерация
  # protobuf"), build context — сама директория сервиса.
  scheduler-background-lane:
    image: mpp/scheduler-background-lane:test
    ports:
      - "9103:9090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # Оценка (estimate) — важное отличие от остальных Java-сервисов здесь:
    # RocksDB state store — off-heap (native) память, не подчиняется
    # -XX:MaxRAMPercentage, так что 75% лимита в Dockerfile ENTRYPOINT
    # ограничивает только JVM heap, RocksDB может расти сверху. 1.5g вместо
    # 1g для остальных consumer-only сервисов — запас под RocksDB
    # block cache/memtables поверх ~1.1g JVM heap. Не откалибровано
    # отдельным нагрузочным прогоном под этим лимитом — см.
    # LATENCY_INVESTIGATION_1500TPS.md, нужна проверка при росте state
    # store (число уникальных message_id с активным retry).
    mem_limit: 1.5g
    depends_on:
      kafka:
        condition: service_healthy

  # --- combined-api-gaps (luminous-hugging-charm.md) — не были заведены ни
  # одной из веток в локальный docker-compose, только в исходном коде.
  # 2026-08-19: заведены здесь, чтобы этот "walking skeleton" фактически
  # поднимался, а не только собирался/тестировался вне Docker.
  # (Восстановлено 2026-08-19 после того, как параллельный agent-проход
  # WEAK_HARDWARE_AUDIT.md/fccc877 расценил этот блок как "unrelated scope
  # creep" и убрал его из своего коммита — контейнеры всё это время
  # оставались реально запущены, просто без этого файла compose их было
  # бы нечем пересоздать.)

  # Dev-mode Vault (HashiCorp officla image) — единственный сервис в этом
  # стеке, которому реально нужен Vault (credential-issuer-service, пишущий
  # клиент). VAULT_MOUNT=secret ниже — дефолтный KV2-mount, который dev-mode
  # уже включает сам, чтобы не нужен был отдельный init-контейнер с
  # `vault secrets enable -path=mpp kv-v2`.
  vault:
    image: hashicorp/vault:1.19
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-token-local-dev
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    healthcheck:
      # 127.0.0.1, не localhost — в этом образе localhost резолвится в IPv6
      # (::1) первым, а Vault dev-режим слушает только IPv4 (0.0.0.0:8200,
      # см. netstat внутри контейнера), так что healthcheck с localhost
      # стабильно падал в "Connection refused" при живом, отвечающем Vault.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health?standbyok=true"]
      interval: 5s
      timeout: 5s
      retries: 10

