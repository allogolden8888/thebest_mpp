    environment:
      REDIS_RUNTIME_HOST: redis-runtime
      REDIS_RUNTIME_PORT: "6379"
      REDIS_RUNTIME_PASSWORD: mpp_local_dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Дефолт internal/services.List — все 34 production-сервиса по k8s
      # Service FQDN (name.mpp.svc) — в этом docker-compose стенде почти
      # никого из них нет, и даже те, что есть, резолвятся по голому имени
      # контейнера, без .mpp.svc (Docker embedded DNS, не k8s). Реальная
      # находка: SERVICES_OVERRIDE один не чинил это — buildTargets() жёстко
