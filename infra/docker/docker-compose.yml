    image: mpp/configuration-service:test
    ports:
      - "9104:9090"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mpp
      POSTGRES_USER: mpp
      POSTGRES_PASSWORD: mpp_local_dev
