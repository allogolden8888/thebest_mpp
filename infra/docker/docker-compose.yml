  # некритично: gRPC-клиенты здесь лениво коннектятся (grpc.NewClient не
  # блокирует и не падает на недостижимом таргете), соответствующие
  # health-проверки просто покажут unhealthy, остальной функционал (RBAC/
  # аудит/credentials/incidents/config) не затронут.
  backoffice-api:
    image: mpp/backoffice-api:test
    ports:
      - "9113:9090"
      - "8084:8080"
    environment:
      JWT_PUBLIC_KEY_PEM: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAr6ChhBR6hStwLBcl/n3z
        N+mFv4S7ocHFZaTdbD5vLRfOcIPIKrXs5Oaf6AKIr2JjKSGI2JWbpprDRw2P4ZK9
        g6USZ9VYvudEh9I+In7x9ds+4TNdaQTh8OKZWq6mFF5Kl6aLuwd5h6er0GoDRDip
        jrD61NZKZp+gMk6CkH5KbiK0sy3Yp/Ip0ELbMkzhJi8nw2Rd5qVbI2wzoi+h6/wb
        Ml4tgq78NFWc4GB96pWLZIotzmZypbqTCOzwDqf5DBGYABHb/2OOF8jmXaodXiWk
