      # partner-portal-ui (статичный nginx, нет /readyz).
      SERVICES_OVERRIDE: "backoffice-api,billing-self-service-api,billing-service,compliance-api,config-event-publisher,configuration-service,credential-issuer-service,delivery-service,destination-resolution-service,iam-service,incident-service,lifecycle-writer,message-state-resolver,operator-smpp-session-manager,ops-visibility-service,partner-notification-service,partner-rest-receiver,partner-self-service-api,pipeline-engine,policy-service,routing-service,scheduler-background-lane,template-management-service"
      # "none" — реальная находка: этот кодбейз повсеместно использует
      # env(key, fallback), которое не отличает "явно задано в пустую
      # строку" от "не задано вообще" — SERVICE_DNS_SUFFIX="" тихо
      # откатывался на дефолт .mpp.svc, подтверждено живым /snapshot после
      # редеплоя. Явный sentinel вместо попытки переизобрести env() только
      # под этот случай.
      SERVICE_DNS_SUFFIX: none
    depends_on:
      redis-runtime:
        condition: service_healthy
      kafka:
        condition: service_healthy

