[package]
name = "partner-rest-receiver"
version = "0.1.0"
edition = "2024"
# services_specifictaion.md §2.1: Rust (Tokio/Axum/Hyper/rust-rdkafka/redis-rs).

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
prost = "0.13"
prost-types = "0.13"
rdkafka = { version = "0.36", features = ["tokio"] }
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
# reqwest — единственный HTTP-клиент в этом сервисе, добавлен ради
# vault_auth.rs (VaultAuthVerifier читает partner credentials из живого
# Vault вместо статических PARTNER_CRED_* env-переменных). rustls-tls (не
# default-tls/native-tls) — не тянуть системный OpenSSL ради одного
# HTTP-клиента, тот же выбор, что уже избегает лишних системных зависимостей
# у rdkafka/redis в этом сервисе.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Не добавлен: async-trait. AuthVerifier::verify теперь возвращает
# `Pin<Box<dyn Future<...>>>` вручную (VaultAuthVerifier делает реальный
# сетевой I/O) — трейт по-прежнему используется как `Box<dyn AuthVerifier>`
# (AppState), поэтому нужен dyn-совместимый async, но ручной boxed-future
# ничем не хуже async-trait для одного метода и не добавляет зависимость.
# AdmissionGate/RateLimiter остаются полностью синхронными.

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tokio-test = "0.4"
tower = "0.5"
