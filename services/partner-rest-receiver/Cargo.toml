[package]
name = "partner-rest-receiver"
version = "0.1.0"
edition = "2024"
# services_specifictaion.md §2.1: Rust (Tokio/Axum/Hyper/rust-rdkafka/redis-rs).

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
prost = "0.13"
prost-types = "0.13"
rdkafka = { version = "0.36", features = ["tokio"] }
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
# Не добавлен: async-trait — ни один трейт здесь не нуждается в async fn
# в trait object (AuthVerifier/AdmissionGate/RateLimiter — все синхронные,
# единственный async I/O — publish_incoming и sync_rate_limit_counters,
# оба конкретные функции, не за трейтом).

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tokio-test = "0.4"
tower = "0.5"
