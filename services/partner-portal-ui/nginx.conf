server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Тот же класс защиты, что services/backoffice-ui/nginx.conf — этот
    # портал тоже несёт мутирующие действия (rotate credential, изменение
    # applications/senders), clickjacking/XSS defense-in-depth оправданы
    # тем же обоснованием.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Локальный docker-compose: target host/port — имена сервисов в
    # docker_default network (infra/docker/docker-compose.yml), не k8s FQDN
    # (тот пример остаётся релевантным для реального k8s-деплоя отдельно,
    # см. infra/, k8s/generate_manifests.py — всё ещё вне скоупа этого
    # прохода). Оба location ДО location / ниже — nginx матчит самый
    # специфичный prefix location первым.
    location /partner-api/ {
        proxy_pass http://partner-self-service-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /billing-api/ {
        proxy_pass http://billing-self-service-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
