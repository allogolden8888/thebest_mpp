server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Тот же класс защиты, что services/backoffice-ui/nginx.conf — этот
    # портал тоже несёт мутирующие действия (rotate credential, изменение
    # applications/senders), clickjacking/XSS defense-in-depth оправданы
    # тем же обоснованием.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Этот контейнер отдаёт только статику — нет location /partner-api или
    # /billing-api, проксирующих в partner-self-service-api/
    # billing-self-service-api, и ни один infra-манифест их не заводит
    # (infra/, k8s/generate_manifests.py — вне скоупа этого прохода, тот же
    # класс отсрочки, что у backoffice-ui/nginx.conf). Пример того, что
    # нужно добавить при реальном деплое:
    #
    #   location /partner-api/ {
    #       proxy_pass http://partner-self-service-api.mpp.svc.cluster.local:8080/;
    #       proxy_set_header Host $host;
    #       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #       proxy_set_header X-Forwarded-Proto $scheme;
    #   }
    #   location /billing-api/ {
    #       proxy_pass http://billing-self-service-api.mpp.svc.cluster.local:8080/;
    #       proxy_set_header Host $host;
    #       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #       proxy_set_header X-Forwarded-Proto $scheme;
    #   }
    #
    # (target host/port иллюстративны) — оба ДО location / ниже, nginx матчит
    # самый специфичный prefix location первым.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
