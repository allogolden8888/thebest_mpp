server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CODE_REVIEW.md MEDIUM finding #6 (subagent-1 / backoffice-ui) — no
    # security headers were served at all. This is the platform-pausing
    # control surface (Execution Control can PAUSE all traffic at GLOBAL
    # scope), so clickjacking protection matters here specifically: an
    # attacker framing a logged-in staff member's session into an invisible
    # iframe could trick clicks into firing destructive actions. CSP is
    # defense-in-depth against a future XSS sink being introduced (none
    # exists today — see README "Positive findings", keep it that way: never
    # use v-html/innerHTML for API-returned strings).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;
    # HSTS only makes sense once this is actually served over TLS
    # (terminated at an ingress/mesh sidecar in this platform's deployment
    # model, not by this container directly) -- left commented so it isn't
    # silently sent over a plain-HTTP dev/local deployment, where it would
    # just be ignored by browsers anyway. Uncomment once TLS termination in
    # front of this service is confirmed:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CODE_REVIEW.md MEDIUM finding #8 (subagent-1 / backoffice-ui) — this
    # container serves static files only; there is no `location /v1 { ... }`
    # proxying to backoffice-api, and no infra manifest under `infra/`/`k8s/`
    # wires one up either (out of scope for this pass -- infra/ and
    # k8s/generate_manifests.py are owned elsewhere, see README "Что НЕ
    # реализовано"). Deployed as-is, every `openapi-fetch` call against the
    # default baseUrl (`/v1`, see src/main.ts VITE_BACKOFFICE_API_URL) falls
    # through to the SPA fallback below (200 HTML), which openapi-fetch
    # cannot parse as JSON -- every view breaks identically.
    #
    # Whoever wires up the real deployment needs to add something like:
    #
    #   location /v1/ {
    #       proxy_pass http://backoffice-api.mpp.svc.cluster.local:8080/v1/;
    #       proxy_set_header Host $host;
    #       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #       proxy_set_header X-Forwarded-Proto $scheme;
    #   }
    #
    # (target host/port here is illustrative -- match whatever
    # backoffice-api's actual k8s Service name/port turns out to be) --
    # *before* this location block, since nginx matches the most specific
    # prefix location.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
