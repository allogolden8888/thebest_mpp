openapi: 3.0.3
info:
  title: Backoffice API
  version: "1.0.0"
  description: >
    Ручно составленная спецификация, отражающая реальные маршруты
    services/backoffice-api/internal/httpapi (service_internal_methods.md
    §7.3). У Backoffice API нет собственного генератора OpenAPI (Go chi не
    генерирует спецификацию автоматически) — этот файл поддерживается
    вручную и должен обновляться при изменении маршрутов backoffice-api.
    Backoffice UI генерирует TypeScript-типы из этого файла
    (`npm run generate:api`, openapi-typescript) — services_specifictaion.md
    §8.5 "OpenAPI-generated client".
servers:
  - url: /v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ConfigVersion:
      type: object
      required: [entity_type, entity_id, version, status]
      properties:
        entity_type: { type: string }
        entity_id: { type: string }
        version: { type: integer, format: int64 }
        status: { type: string }
        created_at: { type: string, format: date-time }
        payload_json: {}
    CreateVersionRequest:
      type: object
      required: [entity_type, entity_id, payload_json]
      properties:
        entity_type: { type: string }
        entity_id: { type: string }
        payload_json: {}
    ArchiveVersionRequest:
      type: object
      required: [entity_type, entity_id, version]
      properties:
        entity_type: { type: string }
        entity_id: { type: string }
        version: { type: integer, format: int64 }
    ListVersionsResponse:
      type: object
      required: [versions, next_page_token]
      properties:
        versions:
          type: array
          items: { $ref: "#/components/schemas/ConfigVersion" }
        next_page_token: { type: string }
    ApplyOverrideRequest:
      type: object
      required: [scope, scope_id, state, admission_rate, reason]
      properties:
        scope: { type: string }
        scope_id: { type: string }
        state: { type: string }
        admission_rate: { type: number }
        reason: { type: string }
        expires_at: { type: string, format: date-time }
    ClearOverrideRequest:
      type: object
      required: [scope, scope_id]
      properties:
        scope: { type: string }
        scope_id: { type: string }
    OverrideResponse:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64 }
        applied_at: { type: string, format: date-time }
    ForceSchedulerCommandRequest:
      type: object
      required: [stage_execution_id, task_type]
      properties:
        stage_execution_id: { type: string }
        task_type:
          type: string
          enum: [CRITICAL_COMMAND_TYPE_FORCE_TIMEOUT, CRITICAL_COMMAND_TYPE_FORCE_RETRY]
        reason: { type: string }
    ForceSchedulerCommandResponse:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
    DlqRecord:
      type: object
      required: [stage_execution_id, message_id, stage_name, attempt, reason_code, created_at, replay_status]
      properties:
        stage_execution_id: { type: string }
        message_id: { type: string }
        stage_name: { type: string }
        attempt: { type: integer }
        reason_code: { type: string }
        error_detail: { type: string }
        created_at: { type: string, format: date-time }
        replay_status: { type: string, enum: [pending, replayed, expired] }
    DlqRecordsResponse:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/DlqRecord" }
    Message:
      type: object
      required: [message_id, partner_id, application_id, trace_id, pipeline_id, pipeline_version, current_status, terminal, created_at, updated_at]
      properties:
        message_id: { type: string }
        partner_id: { type: string }
        application_id: { type: string }
        trace_id: { type: string }
        pipeline_id: { type: string }
        pipeline_version: { type: string }
        current_status: { type: string }
        terminal: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MessagesResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
    LifecycleEvent:
      type: object
      required: [lifecycle_version, status, event_id, occurred_at, source]
      properties:
        lifecycle_version: { type: integer }
        status: { type: string }
        event_id: { type: string }
        occurred_at: { type: string, format: date-time }
        source: { type: string }
    MessageDetailResponse:
      type: object
      required: [message, history]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        history:
          type: array
          items: { $ref: "#/components/schemas/LifecycleEvent" }
    ReplayRequest:
      type: object
      required: [stage_execution_id]
      properties:
        stage_execution_id: { type: string }
    ReplayResponse:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        rejection_reason: { type: string }
    ReconciliationCase:
      type: object
      required: [case_id, message_id, stage_execution_id, operator_id, status, opened_at, deadline_at]
      properties:
        case_id: { type: string }
        message_id: { type: string }
        stage_execution_id: { type: string }
        operator_id: { type: string }
        status: { type: string, enum: [open, resolved, unresolved] }
        opened_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
    ReconciliationCasesResponse:
      type: object
      required: [cases]
      properties:
        cases:
          type: array
          items: { $ref: "#/components/schemas/ReconciliationCase" }
    ReportRow:
      type: object
      required: [hour, partner_id, stage_name, outcome, event_count]
      properties:
        hour: { type: string, format: date-time }
        partner_id: { type: string }
        stage_name: { type: string }
        outcome: { type: string }
        event_count: { type: integer }
    ReportResponse:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/ReportRow" }
    LedgerEntry:
      type: object
      required: [id, charge_id, account_id, partner_id, amount, currency, entry_type, created_at]
      properties:
        id: { type: integer }
        charge_id: { type: string }
        account_id: { type: string }
        partner_id: { type: string }
        amount: { type: string }
        currency: { type: string }
        entry_type: { type: string, enum: [charge, compensating] }
        source_charge_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    LedgerEntriesResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
    LedgerSummaryRow:
      type: object
      required: [key, charges, compensations, net, entry_count]
      properties:
        key: { type: string }
        charges: { type: string }
        compensations: { type: string }
        net: { type: string }
        entry_count: { type: integer }
    LedgerSummaryResponse:
      type: object
      required: [currency, group_by, rows]
      properties:
        currency: { type: string }
        group_by: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/LedgerSummaryRow" }
    ConsentStatus:
      type: object
      required: [msisdn, blocked_categories, blocked_senders]
      properties:
        msisdn: { type: string }
        blocked_categories:
          type: array
          items: { type: string }
        blocked_senders:
          type: array
          items: { type: string }
    ManualConsentRequest:
      type: object
      required: [msisdn, scope_type, scope_value, channel, action, reason]
      properties:
        msisdn: { type: string }
        scope_type: { type: string, enum: [CATEGORY, SENDER] }
        scope_value: { type: string }
        channel: { type: string }
        action: { type: string, enum: [block, unblock] }
        reason: { type: string }
    ManualConsentResponse:
      type: object
      required: [entity_id, version, status]
      properties:
        entity_id: { type: string }
        version: { type: integer }
        status: { type: string }
    OperatorRoute:
      type: object
      required: [operator_id, route_id, protocol, owning_instance_id, endpoint, route_epoch, heartbeat, ttl_seconds]
      properties:
        operator_id: { type: string }
        route_id: { type: string }
        protocol: { type: string }
        owning_instance_id: { type: string }
        endpoint: { type: string }
        route_epoch: { type: integer }
        heartbeat: { type: string, format: date-time }
        ttl_seconds: { type: integer }
    OperatorRoutesResponse:
      type: object
      required: [routes]
      properties:
        routes:
          type: array
          items: { $ref: "#/components/schemas/OperatorRoute" }
    OperatorEventSegment:
      type: object
      required: [segment_id, operator_id, smsc_message_id, stage_execution_id, submitted_at, dlr_expires_at]
      properties:
        segment_id: { type: integer }
        operator_id: { type: string }
        smsc_message_id: { type: string }
        stage_execution_id: { type: string }
        submitted_at: { type: string, format: date-time }
        dlr_expires_at: { type: string, format: date-time }
    MessageOperatorEventsResponse:
      type: object
      required: [message_id, segments]
      properties:
        message_id: { type: string }
        segments:
          type: array
          items: { $ref: "#/components/schemas/OperatorEventSegment" }
    PduLogEntry:
      type: object
      required: [direction, pdu_type, sequence_number, protocol, message_id, stage_execution_id, smsc_message_id, segment_id, status, occurred_at]
      properties:
        direction: { type: string }
        pdu_type: { type: string }
        sequence_number: { type: integer }
        protocol: { type: string }
        message_id: { type: string }
        stage_execution_id: { type: string }
        smsc_message_id: { type: string }
        segment_id: { type: integer }
        status: { type: string }
        occurred_at: { type: string, format: date-time }
    MessagePduLogResponse:
      type: object
      required: [message_id, pdus]
      properties:
        message_id: { type: string }
        pdus:
          type: array
          items: { $ref: "#/components/schemas/PduLogEntry" }
    MeResponse:
      type: object
      required: [external_id, roles, permissions]
      properties:
        external_id: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
    AuditEntry:
      type: object
      required: [source, actor, action, target, created_at]
      properties:
        source:
          type: string
          enum: [replay, execution_control, billing_reconciliation, identity]
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        created_at: { type: string, format: date-time }
    AuditResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_offset: { type: integer, nullable: true }
    IamRole:
      type: object
      required: [id, name, description, permissions]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
    IamRolesResponse:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { $ref: "#/components/schemas/IamRole" }
    StaffAssignment:
      type: object
      required: [id, external_id, role, granted_by, granted_at]
      properties:
        id: { type: integer, format: int64 }
        external_id: { type: string }
        role: { type: string }
        granted_by: { type: string }
        granted_at: { type: string, format: date-time }
    StaffAssignmentsResponse:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items: { $ref: "#/components/schemas/StaffAssignment" }
    CreateStaffAssignmentRequest:
      type: object
      required: [external_id, role]
      properties:
        external_id: { type: string }
        role: { type: string }
    CreateStaffAssignmentResponse:
      type: object
      required: [assignment]
      properties:
        assignment: { $ref: "#/components/schemas/StaffAssignment" }
    RevokeStaffAssignmentResponse:
      type: object
      required: [revoked]
      properties:
        revoked: { type: boolean }
    PartnerPortalAssignment:
      type: object
      required: [id, external_id, role, granted_by, granted_at]
      properties:
        id: { type: integer, format: int64 }
        external_id: { type: string }
        role: { type: string, enum: [partner-admin, partner-viewer] }
        granted_by: { type: string }
        granted_at: { type: string, format: date-time }
    PartnerPortalAssignmentsResponse:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items: { $ref: "#/components/schemas/PartnerPortalAssignment" }
    CreatePartnerPortalAssignmentRequest:
      type: object
      required: [external_id, role]
      properties:
        external_id: { type: string }
        role: { type: string, enum: [partner-admin, partner-viewer] }
    CreatePartnerPortalAssignmentResponse:
      type: object
      required: [assignment]
      properties:
        assignment: { $ref: "#/components/schemas/PartnerPortalAssignment" }
    RevokePartnerPortalAssignmentResponse:
      type: object
      required: [revoked]
      properties:
        revoked: { type: boolean }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
    StaffAccount:
      type: object
      required: [external_id, username, display_name, active, created_at]
      properties:
        external_id: { type: string }
        username: { type: string }
        display_name: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    StaffAccountsResponse:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/StaffAccount" }
    CreateStaffAccountRequest:
      type: object
      required: [username, password, display_name]
      properties:
        username: { type: string }
        password: { type: string }
        display_name: { type: string }
    CreateStaffAccountResponse:
      type: object
      required: [account]
      properties:
        account: { $ref: "#/components/schemas/StaffAccount" }
    DeactivateStaffAccountResponse:
      type: object
      required: [deactivated]
      properties:
        deactivated: { type: boolean }
    RotateCredentialResponse:
      type: object
      required: [credential_ref, secret_version, plaintext_secret]
      properties:
        credential_ref: { type: string }
        secret_version: { type: integer }
        plaintext_secret:
          type: string
          description: >
            Присутствует ТОЛЬКО в этом одном ответе (show-once) — нигде не
            сохраняется, повторно недоступен после закрытия модалки.
        issued_at: { type: string, format: date-time }
    IssuedSecret:
      type: object
      required: [id, partner_id, application_id, credential_ref, secret_version, status, issued_by]
      properties:
        id: { type: integer, format: int64 }
        partner_id: { type: string }
        application_id: { type: string }
        credential_ref: { type: string }
        secret_version: { type: integer }
        status: { type: string }
        issued_at: { type: string, format: date-time }
        issued_by: { type: string }
    IssuedSecretsResponse:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items: { $ref: "#/components/schemas/IssuedSecret" }
    ValidateVersionRequest:
      type: object
      required: [entity_type, payload_json]
      properties:
        entity_type: { type: string }
        payload_json: {}
    ValidateVersionResponse:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { type: string }
    DiffVersionsResponse:
      type: object
      required: [from_version, from_payload_json, to_version, to_payload_json]
      properties:
        from_version: { type: integer }
        from_payload_json: {}
        to_version: { type: integer }
        to_payload_json: {}
    Incident:
      type: object
      required: [id, title, severity, status, opened_by, opened_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        status: { type: string, enum: [OPEN, RESOLVED] }
        opened_by: { type: string }
        opened_at: { type: string, format: date-time }
        resolved_by: { type: string }
        resolved_at: { type: string, format: date-time }
        postmortem_notes: { type: string }
    OpenIncidentRequest:
      type: object
      required: [title, severity]
      properties:
        title: { type: string }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    ListIncidentsResponse:
      type: object
      required: [incidents]
      properties:
        incidents:
          type: array
          items: { $ref: "#/components/schemas/Incident" }
    TimelineEntry:
      type: object
      required: [id, scope, scope_id, state, admission_rate, reason, requested_by]
      properties:
        id: { type: integer, format: int64 }
        scope: { type: string }
        scope_id: { type: string }
        state: { type: string }
        admission_rate: { type: number }
        reason: { type: string }
        requested_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    IncidentNote:
      type: object
      required: [id, incident_id, author, note]
      properties:
        id: { type: integer, format: int64 }
        incident_id: { type: integer, format: int64 }
        author: { type: string }
        note: { type: string }
        created_at: { type: string, format: date-time }
    IncidentDetail:
      type: object
      required: [incident, timeline, notes]
      properties:
        incident: { $ref: "#/components/schemas/Incident" }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/IncidentNote" }
    AddNoteRequest:
      type: object
      required: [note]
      properties:
        note: { type: string }
    ResolveIncidentRequest:
      type: object
      required: [postmortem_notes]
      properties:
        postmortem_notes: { type: string }
    PartitionLag:
      type: object
      required: [topic, partition, commit_offset, end_offset, lag]
      properties:
        topic: { type: string }
        partition: { type: integer }
        commit_offset: { type: integer, format: int64 }
        end_offset: { type: integer, format: int64 }
        lag: { type: integer, format: int64 }
        error: { type: string }
    ConsumerGroupLag:
      type: object
      required: [group, state, total_lag, partitions]
      properties:
        group: { type: string }
        state: { type: string }
        total_lag: { type: integer, format: int64 }
        partitions:
          type: array
          items: { $ref: "#/components/schemas/PartitionLag" }
        error: { type: string }
    KafkaLagSnapshot:
      type: object
      required: [generated_at, bootstrap_servers, groups]
      properties:
        generated_at: { type: string, format: date-time }
        bootstrap_servers:
          type: array
          items: { type: string }
        groups:
          type: array
          items: { $ref: "#/components/schemas/ConsumerGroupLag" }
        error: { type: string }
    ReadyzResult:
      type: object
      required: [service, ready, latency_ms]
      properties:
        service: { type: string }
        ready: { type: boolean }
        http_status: { type: integer }
        latency_ms: { type: integer, format: int64 }
        error: { type: string }
    ReadyzSnapshot:
      type: object
      required: [generated_at, services]
      properties:
        generated_at: { type: string, format: date-time }
        services:
          type: array
          items: { $ref: "#/components/schemas/ReadyzResult" }
    OpsSnapshotResponse:
      type: object
      required: [kafka_lag_available, readyz_available]
      properties:
        kafka_lag:
          allOf: [{ $ref: "#/components/schemas/KafkaLagSnapshot" }]
          nullable: true
        kafka_lag_available: { type: boolean }
        readyz:
          allOf: [{ $ref: "#/components/schemas/ReadyzSnapshot" }]
          nullable: true
        readyz_available: { type: boolean }
    ChatMessage:
      type: object
      required: [id, partner_id, sender_type, sender_id, body]
      properties:
        id: { type: integer, format: int64 }
        partner_id: { type: string }
        sender_type: { type: string, enum: [partner, admin] }
        sender_id: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time }
    ListChatMessagesResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
    SendChatMessageRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }
    ChatThread:
      type: object
      required: [partner_id, last_message_body, unread_count]
      properties:
        partner_id: { type: string }
        last_message_body: { type: string }
        last_message_at: { type: string, format: date-time }
        unread_count: { type: integer, format: int64 }
    ListChatThreadsResponse:
      type: object
      required: [threads]
      properties:
        threads:
          type: array
          items: { $ref: "#/components/schemas/ChatThread" }
paths:
  /config/versions:
    post:
      operationId: createConfigVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVersionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigVersion" }
    get:
      operationId: listConfigVersions
      parameters:
        - name: entity_type
          in: query
          required: true
          schema: { type: string }
        - name: entity_id
          in: query
          description: >-
            Пусто/опущено — browse-режим, по одной последней активной версии
            на каждый entity_id этого entity_type (Categories/CTN экраны).
            Заполнено — история версий одной уже известной сущности
            (ConfigView.vue, page_size/page_token применяются только здесь).
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer }
        - name: page_token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListVersionsResponse" }
  /config/versions/active:
    get:
      operationId: getActiveConfigVersion
      parameters:
        - name: entity_type
          in: query
          required: true
          schema: { type: string }
        - name: entity_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigVersion" }
  /config/versions/archive:
    post:
      operationId: archiveConfigVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveVersionRequest" }
      responses:
