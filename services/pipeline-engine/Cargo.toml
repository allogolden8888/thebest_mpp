[package]
name = "pipeline-engine"
version = "0.1.0"
edition = "2024"
# services_specifictaion.md §2.3: Rust (Tokio/rust-rdkafka/ArcSwap).

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
prost = "0.13"
prost-types = "0.13"
rdkafka = { version = "0.36", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
# Execution State CAS — Runtime Redis (hld.md §7.2/§9.1).
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tokio-test = "0.4"
tower = "0.5"
