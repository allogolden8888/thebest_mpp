[package]
name = "pipeline-engine"
version = "0.1.0"
edition = "2024"
# services_specifictaion.md §2.3: Rust (Tokio/rust-rdkafka/ArcSwap).

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
prost = "0.13"
prost-types = "0.13"
rdkafka = { version = "0.36", features = ["tokio"] }
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
# redis — development_plan.md 4.2: cas_transition_and_track_deadline теперь
# реально реализован (src/redis_cas.rs), не заглушка — см. README.
# Не добавлены: async-trait, arc-swap — hot-reload графа из config.changes
# всё ещё не реализован в этом срезе, см. README "Что НЕ реализовано".

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tokio-test = "0.4"
tower = "0.5"
