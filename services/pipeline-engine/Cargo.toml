[package]
name = "pipeline-engine"
version = "0.1.0"
edition = "2024"
# services_specifictaion.md §2.3: Rust (Tokio/rust-rdkafka/ArcSwap).

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
prost = "0.13"
prost-types = "0.13"
rdkafka = { version = "0.36", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
# Не добавлены: redis, async-trait, arc-swap — все трое заявлены в спеке
# (services_specifictaion.md §2.3) для функциональности, которой в этом
# срезе ещё нет (Runtime Redis CAS, hot-reload графа из config.changes) —
# кодревью отметило их как "dead deps inconsistent with the stated
# architecture" в первой версии. Появятся вместе с реальным использованием,
# не раньше — см. README "Что НЕ реализовано".

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tokio-test = "0.4"
tower = "0.5"
